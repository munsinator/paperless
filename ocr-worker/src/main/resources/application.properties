spring.application.name=ocr-worker

# Load the shared .env when launched from the repository root or this module.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

logging.level.at.technikum.ocrworker=DEBUG

spring.rabbitmq.host=${SPRING_RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.virtual-host=${RABBIT_VHOST}
