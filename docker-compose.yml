services:
  paperless-mq:
    image: rabbitmq:3-management-alpine
    container_name: paperless-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST}
    #volumes:
    #  - paperless-mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  paperless-web-ui:
    build: ./frontend
    container_name: paperless-web-ui
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

  paperless-rest:
    build: ./api
    container_name: paperless-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paperless
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_RABBITMQ_HOST: paperless-mq
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      RABBIT_VHOST: ${RABBIT_VHOST}
    depends_on:
      postgres:
        condition: service_healthy
      paperless-mq:
        condition: service_healthy

  ocr-worker:
    build: ./ocr-worker
    environment:
      SPRING_RABBITMQ_HOST: paperless-mq
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      RABBIT_VHOST: ${RABBIT_VHOST}
    depends_on:
      paperless-mq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: paperless-db
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  #paperless-mq-data:
