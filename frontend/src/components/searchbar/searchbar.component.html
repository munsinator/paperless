<form class="w-full max-w-md min-w-[200px] mx-auto" (submit)="$event.preventDefault(); submitSearch()">
  <div class="relative flex items-center">
    <input name="query" [(ngModel)]="query" class="w-full bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md pl-3 pr-24 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300" placeholder="Dokument suchen..." />
    <div class="absolute right-1 flex items-center gap-1">
      <button class="flex items-center rounded bg-slate-800 py-1 px-2.5 border border-transparent text-center text-sm text-white transition-all hover:shadow focus:bg-slate-700 hover:bg-slate-700" type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 mr-1.5">
          <path fill-rule="evenodd" d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z" clip-rule="evenodd" />
        </svg>
        Search
      </button>
    </div>
  </div>
</form>
