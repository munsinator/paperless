<nav class="block w-full px-4 py-2 bg-white bg-opacity-90 sticky top-0 shadow lg:px-8 lg:py-3 backdrop-blur-lg backdrop-saturate-150 z-[9999]">
  <div class="container flex flex-wrap items-center justify-between mx-auto text-slate-800">
    <a [routerLink]="isLoggedIn() ? '/dashboard' : '/auth'"
      class="mr-4 block cursor-pointer py-1.5 text-base text-slate-800 font-semibold">
      paperless
    </a>

    <!-- Desktop -->
    <div class="hidden lg:block">
      <ul class="flex flex-col gap-2 mt-2 mb-4 lg:mb-0 lg:mt-0 lg:flex-row lg:items-center lg:gap-6">
        @for (item of menuItems(); track item.label) {
        <li class="flex items-center p-1 text-sm gap-x-2 text-slate-600 hover:font-bold transition-all">
          @if (item.action === 'logout') {
          <button type="button" (click)="logout()" class="hover:font-bold">{{ item.label }}</button>
          } @else {
          <a [routerLink]="item.route">{{ item.label }}</a>
          }
        </li>
        }
      </ul>
    </div>

    <!-- Burgermenü-Button -->
    <button
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Menü umschalten"
      class="relative ml-auto h-6 max-h-[40px] w-6 max-w-[40px] select-none rounded-lg text-center align-middle text-xs font-medium uppercase text-inherit transition-all hover:bg-transparent focus:bg-transparent active:bg-transparent disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none lg:hidden"
      type="button">
      <span class="absolute transform -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </span>
    </button>
  </div>

  <!-- Mobile Ansicht -->
  @if (isMenuOpen()) {
    <div class="block lg:hidden mt-2 pt-2 border-t border-slate-200">
      <ul class="flex flex-col gap-2 pb-2">
        @for (item of menuItems(); track item.label) {
        <li class="p-1 text-sm text-slate-600 hover:font-bold">
          @if (item.action === 'logout') {
          <button type="button" (click)="logout()" class="hover:font-bold">{{ item.label }}</button>
          } @else {
          <a [routerLink]="item.route" (click)="closeMenu()">{{ item.label }}</a>
          }
        </li>
        }
      </ul>
    </div>
  }
</nav>
