<div class="w-full bg-white border border-slate-200 rounded-md p-4 flex flex-col gap-3">
    <!-- Titel & Kategorie -->
    <div class="w-full flex items-start justify-between gap-2">
        <a [routerLink]="['/document', document().id]"
            class="font-medium text-slate-800 hover:text-slate-600 text-sm block break-words">
            {{ document().title }}
        </a>
        @if (document().documentType) {
        <span
            class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-600 border border-slate-200 shrink-0">
            {{ documentTypeLabel(document().documentType) }}
        </span>
        }
    </div>

    <!-- Erstellungsdatum -->
    <div class="w-full text-xs text-slate-400">
        Erstellt: {{ document().createdAt | date:'dd.MM.yyyy' }}
    </div>

    <!-- Tags -->
    @if (document().tags?.length) {
    <div class="w-full flex flex-row flex-wrap gap-1.5">
        @for (tag of document().tags; track tag) {
        <span class="border border-slate-200 text-slate-600 text-xs px-2 py-0.5 rounded">
            #{{ tag }}
        </span>
        }
    </div>
    }

    <!-- Aktions-Buttons & Link -->
    <div class="flex items-center justify-between pt-2 border-t border-slate-100 mt-1">
        <div class="flex items-center gap-1.5">
            <button type="button" (click)="openEditModal()" title="Dokument bearbeiten"
                class="border border-slate-200 hover:bg-slate-100 text-slate-600 text-xs px-2.5 py-1.5 rounded transition-colors inline-flex items-center gap-1 font-medium cursor-pointer">
                Bearbeiten
            </button>
            <button type="button" (click)="onDelete()" title="Dokument löschen"
                class="border border-red-200 hover:bg-red-50 text-red-600 text-xs px-2.5 py-1.5 rounded transition-colors inline-flex items-center gap-1 font-medium cursor-pointer">
                Löschen
            </button>
        </div>

        <a [routerLink]="['/document', document().id]"
            class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-1.5 rounded transition-colors inline-flex items-center gap-1 font-medium">
            Details anzeigen →
        </a>
    </div>
</div>

@if (isEditModalOpen()) {
<app-edit-document-modal [document]="document()" (saved)="onSaveEdit($event)" (closed)="closeEditModal()">
</app-edit-document-modal>
}
