spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/paperless
spring.datasource.username=paperless
spring.datasource.password=paperless_password

spring.profiles.include=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081
# Set JWT_SECRET to a Base64-encoded key of at least 32 bytes; do not commit the key.
jwt.secret=${JWT_SECRET:}

# PDF uploads (frontend limit: 15 MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
