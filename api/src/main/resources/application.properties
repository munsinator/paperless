spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/paperless
spring.datasource.username=paperless
spring.datasource.password=paperless_password

spring.profiles.include=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081
# Set JWT_SECRET to a Base64-encoded key of at least 32 bytes; do not commit the key.
jwt.secret=${JWT_SECRET:}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.virtual-host=${RABBIT_VHOST}
